 background:radial-gradient(640px 520px at 100% 0%,#3a3fd422,transparent 70%),radial-gradient(560px 480px at 0% 100%,#ff8a3d24,transparent 70%),#fbfaf6}

<div class="top"><div class="brand"><img src="assets/logo-mark.svg"><span><b>cloud</b>commerce</span></div><div class="pill">🗳️ আপনার মতামত</div></div>
